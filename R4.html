<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="page-loader">
        <div class="loader-box">Vroom...</div>
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <header>
        <div class="title-wrapper">
            <div class="scribble-underLine"></div>
            <h1 class="Title">Research Page 4</h1>
            <div class="scribble-underLine"></div>
        </div>
        <p class="subtitle">~Add more Research Here~</p>
    </header>

    <div class="hamsterA">
     
    </div>

    <div class="topicColume">
        <div class="Topic">
            <img class="None" src="None" alt="car" align="left">
            <br>
            <p>  Add text Here</p>
            <p> </p>
            <p> </p>
            <p> </p>
            <p> </p>
        </div>
    </div>

    <a class="backButton" href="main.html">Back</a>

    <script>

        window.addEventListener('load', () => {
                const loader = document.getElementById('page-loader');
                setTimeout(() => {
                    loader.classList.add('fade-out');
                    setTimeout(() => loader.remove(), 300);
                }, 500)
            });

            document.querySelectorAll('a, button[onclick]').forEach(el => {
                el.addEventListener('click', () => {
                    const loader = document.createElement('div');
                    loader.id = 'page-loader';
                    loader.innerHTML = `
                    <div class="loader-box">Vroom...</div>
                    <div class="loader-dots"><span></span><span></span><span></span></div>
                    `;
                    document.body.appendChild(loader);
                });
            });

    </script>
   
    
</body>
</html>
