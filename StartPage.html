<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    

    <header>
        <div class="title-wrapper">
            <div class="scribble-underLine"></div>
            <h1 class="Title">Before You Proceed </h1>
            <div class="scribble-underLine"></div>
        </div>
        <p class="subtitle">~Please Enter and Answer these Questions ~</p>
    </header>

    <div class="Login">
        <p class="LoginLabel">Enter your name to continue:</p>
        <input class="LoginInput" type="text" placeholder="username" name="username">
        <a class="backButton" href="main.html" onClick="SaveUserName()">Continue</a> 
    </div>

    <div class="FavColor" id="FavColor">
        <p class="LoginLabel">WHat is your Favorite Color: </p>

        <div class="CircleA"></div> 
        <div class="CircleB"></div> 
        
    </div>

    <script>
        function SaveUserName() {
            let username = 
                document.querySelector('.LoginInput').value;

            localStorage.setItem("username", username);
        }

        window.addEventListener('load', () => {
                const loader = document.getElementById('page-loader');
                setTimeout(() => {
                    loader.classList.add('fade-out');
                    setTimeout(() => loader.remove(), 300);
                }, 500)
            });

            document.querySelectorAll('a, button[onclick]').forEach(el => {
                el.addEventListener('click', () => {
                    const loader = document.createElement('div');
                    loader.id = 'page-loader';
                    loader.innerHTML = `
                    <div class="loader-box">Vroom...</div>
                    <div class="loader-dots"><span></span><span></span><span></span></div>
                    `;
                    document.body.appendChild(loader);
                });
            });
        
    </script>
    
</body>
</html>
