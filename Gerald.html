<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>



    <nav class="topbar">
         <div class="Circle" onClick="SettingsMenu()">

          <div class="nav-divider"></div>

          <button type="button" onclick="window.location.href='main.html'">🏠 Home</button>
          <button type="button" onclick="window.location.href='Topic.html'">📖 Topic</button>
          <button type="button" onclick="window.location.href='Opportunities.html'">✨ Opportunities</button>
          <button type="button" onclick="window.location.href='Risks.html'">⚠️ Risks</button>  
          <button type="button" onclick="window.location.href='Choices.html'">🔀 Choices</button>
          <button type="button" onclick="window.location.href='References.html'">📚 References</button> 
          <button type="button" onclick="window.location.href='Team_member.html'">👥 Team</button> 
          <button type="button" onclick="window.location.href='Meeting.html'">📝 Minutes</button>    

          <div class="nav-divider"></div>

          <button class="funnyb" id="FrogButton" type="button" onclick="window.location.href='gerald.html'">do not click me heheh 🐸</button>

            <h2 class="WelcomeText" id="WelcomeText"> </h2>
        </div>
     </nav>

    <div id="page-loader">
        <div class="loader-box">Vroom...</div>
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <header>
        <div class="title-wrapper">
            <div class="scribble-underline"></div>
            <h1 class="Title">Gerald</h1>
            <div class="scribble-underline"></div>
        </div>
        <p class="subtitle">~Gerald's Page~</p>
    </header>

    <div class="hamsterA">
     
    </div>

    <div class="topicColume">
        <div class="Topic">
            <h2><span class="topic-num">🐸</span> ~Gerald~</h2>
            <video class="frogvid" src="videos\forg.mp4" alt="car" align="left" autoplay loop muted></video>
            <br>
            <p> Gerald is a cool guy who likes to fly in cars </p>
            <p> He is Green and he is a frog. He is mine 🐸.</p>
            
        </div>
    </div>

    <a class="backButton" href="main.html">Back</a>
   
    <script>

        window.addEventListener('load', () => {
                const loader = document.getElementById('page-loader');
                setTimeout(() => {
                    loader.classList.add('fade-out');
                    setTimeout(() => loader.remove(), 300);
                }, 500)
            });

            document.querySelectorAll('a, button[onclick]').forEach(el => {
                el.addEventListener('click', () => {
                    const loader = document.createElement('div');
                    loader.id = 'page-loader';
                    loader.innerHTML = `
                    <div class="loader-box">Vroom...</div>
                    <div class="loader-dots"><span></span><span></span><span></span></div>
                    `;
                    document.body.appendChild(loader);
                });
            });

    </script>


</body>
</html>
